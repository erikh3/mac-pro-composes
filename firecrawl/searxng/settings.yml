# SearXNG settings for the bundled Firecrawl /search provider.
# https://docs.searxng.org/admin/settings/index.html
# Internal-only instance (private `firecrawl` network, no host port exposed).
use_default_settings: true

server:
  # Session/CSRF signing key. Safe as a static value here: this SearXNG has no
  # published port and lives only on the private `firecrawl` network, reachable
  # solely by firecrawl-api (no browser users, no external/localhost access).
  secret_key: "firecrawl-searxng-internal"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  # Firecrawl queries the JSON API; it is disabled by default and must be enabled.
  formats:
    - html
    - json
